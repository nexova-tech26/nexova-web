server {
    listen 80;
    server_name nexovatech.com.co www.nexovatech.com.co;
    
    # Redirección automática de HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nexovatech.com.co www.nexovatech.com.co;

    # Certificados SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/nexovatech.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexovatech.com.co/privkey.pem;

    # Optimización de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers border_colors;

    # Carpeta raíz donde Docker monta los archivos compilados de Vue/Vite
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para conectar con el Backend en FastAPI
    location /api/ {
        proxy_pass http://nexova_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}