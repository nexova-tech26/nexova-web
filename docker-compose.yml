version: '3.8'

services:
  backend:
    build: ./backend
    container_name: nexova_backend
    ports:
      - "8000:8000"
    restart: always

frontend:
    build: ./frontend
    container_name: nexova_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always